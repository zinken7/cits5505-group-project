<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watchlist Hub API — Swagger UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/docs_nav.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" crossorigin="anonymous">
  <style>
    body { margin: 0; }
    .topbar { display: none; }
    .swagger-ui .info .title { font-size: 1.5rem; }
  </style>
</head>
<body class="docs-standalone">
  {% include "components/docs_subnav.html" %}
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin="anonymous"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      tryItOutEnabled: true,
    });
  </script>
</body>
</html>
