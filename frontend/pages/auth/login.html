<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WatchList Hub</title>
    <link rel="stylesheet" href="/frontend/src/style.css">
</head>
<body class="auth-page flex items-center justify-center min-h-screen">
    <div class="auth-card p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-primary">Welcome to WatchList Hub</h1>
            <p class="text-muted">Sign in to your account</p>
        </div>
        <form class="auth-form space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-primary mb-1">Username or Email</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-accent-primary">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-primary mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-border rounded-md focus:outline-none focus:ring-2 focus:ring-accent-primary">
            </div>
            <button type="submit" class="auth-btn w-full text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-accent-primary">
                Sign In
            </button>
        </form>
        <div class="mt-6 text-center">
            <p class="text-muted">Don`t have an account? <a href="register.html" class="text-accent-primary hover:underline">Sign up</a></p>
        </div>
    </div>
</body>
</html>
